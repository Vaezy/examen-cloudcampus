services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  notifications:
    build: ./microservices/notifications
    environment:
      NODE_ENV: production
      NOTIFI_PORT: 4002
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APPLICATION_PASSWORD: ${EMAIL_APPLICATION_PASSWORD}
    expose:
      - '4002'

  stock-management:
    build: ./microservices/stock-management
    environment:
      NODE_ENV: production
      PORT: 4003
    expose:
      - '4003'

  gateway:
    build: ./gateway
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 8000
      NOTIFI_SERVICE_URL: http://notifications:4002
      STOCK_SERVICE_URL: http://stock-management:4003
    depends_on:
      - notifications
      - stock-management

  backend:
    build: ./backend
    ports:
      - '127.0.0.1:5001:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/exam1Db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_URL: http://gateway:8000
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5001/api
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
