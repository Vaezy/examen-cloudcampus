services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    build: ./microservices/notifications
    environment:
      NOTIFI_PORT: 4002
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_APPLICATION_PASSWORD: ${EMAIL_APPLICATION_PASSWORD}
    expose:
      - '4002'

  stock-management:
    build: ./microservices/stock-management
    environment:
      PORT: 4003
    expose:
      - '4003'

  gateway:
    build: ./gateway
    ports:
      - '8000:8000'
    environment:
      GATEWAY_PORT: 8000
      NOTIFI_SERVICE_URL: http://notifications:4002
      STOCK_SERVICE_URL: http://stock-management:4003
    depends_on:
      - notifications
      - stock-management

  backend:
    build: ./backend
    ports:
      - '5001:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/exam1Db
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_URL: http://gateway:8000
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5001/api
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
